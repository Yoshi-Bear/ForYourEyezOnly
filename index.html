<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Your Eyes Only ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="hearts-container"></div>
    <div class="container">
        <div id="fireworks"></div>
        <div class="intro">
            <p class="small-text">A little something for you...</p>

            <h1>For Your Eyes Only ❤️</h1>

            <p>
                Put on your headphones.
                I made something for you.
            </p>
        </div>

        <div class="music-card">

            <div class="album-art">
                🎵
            </div>

            <div class="song-info">
                <h2>Our Song</h2>
                <p>Just for you ❤️</p>
            </div>

            <button id="playButton">▶</button>

            <audio id="music" src="music/song.mp3"></audio>

        </div>


        <!-- ENVELOPES -->

        <div class="envelope-section">

            <p class="envelope-intro">
                While you listen... open a few things for me 💌
            </p>

            <div class="envelopes">

                <button class="envelope">
                    <span>💌</span>
                    <strong>Open when you miss me</strong>
                </button>

                <button class="envelope">
                    <span>💌</span>
                    <strong>Open when you need reassurance</strong>
                </button>

                <button class="envelope">
                    <span>💌</span>
                    <strong>Open when you need to smile</strong>
                </button>

                <button class="envelope">
                    <span>🌙</span>
                    <strong>Open before you sleep</strong>
                </button>

                <button class="envelope final">
                    <span>❤️</span>
                    <strong>Open this one last...</strong>
                </button>

            </div>

        </div>


    </div>
    <div class="attraction-game">

        <h2>Who is the most attractive one in the relationship? 😏</h2>

        <p>Choose wisely... there may be consequences. 😂</p>

        <div class="attraction-buttons">

            <button id="ayeshaChoice" class="attraction-button">
                💗 Ayesha
            </button>

            <button id="ziyaadChoice" class="attraction-button">
                😎 Ziyaad
            </button>

        </div>

        <p id="attractionResult"></p>

    </div>



    <div id="messageOverlay" class="overlay">

        <div class="message-box">

            <button id="closeButton">×</button>

            <div id="messageIcon">💌</div>

            <h2 id="messageTitle"></h2>

            <p id="messageText"></p>

        </div>

    </div>


    <script src="script.js"></script>

    <script src="script.js"></script>
</body>

</html>
